name: Portfolio Project Tests

on:
  push:
    branches: [main]
    paths:
      - "projects/**"
      - ".github/workflows/portfolio-tests.yml"
  pull_request:
    paths:
      - "projects/**"
      - ".github/workflows/portfolio-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-projects:
    name: Python Projects / Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Network Monitor
        working-directory: projects/network-monitor
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Test Finance Tracker
        working-directory: projects/finance-tracker
        run: python -m unittest discover -p 'test_*.py' -v

  java-projects:
    name: Java Projects / Compile & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test AlgoArena
        working-directory: projects/algoarena
        run: |
          javac AlgoArena.java AlgoArenaTest.java
          java AlgoArenaTest
      - name: Test ThreatTrace
        working-directory: projects/threattrace
        run: |
          javac ThreatTrace.java ThreatTraceTest.java
          java ThreatTraceTest
